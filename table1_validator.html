<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Table 1 - BPLS Business CSV Validator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f2f5;padding:20px}
h2{color:#1a1a2e;margin-bottom:12px;font-size:20px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;background:#fff;padding:14px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.toolbar input[type=file]{font-size:14px}
.btn{padding:8px 18px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:#4361ee;color:#fff}
.btn-primary:hover:not(:disabled){background:#3a56d4}
.btn-success{background:#2ec4b6;color:#fff}
.btn-success:hover:not(:disabled){background:#26a89c}
.btn-warning{background:#ff9f1c;color:#fff}
.btn-warning:hover:not(:disabled){background:#e68f15}
.btn-purple{background:#7c3aed;color:#fff}
.btn-purple:hover:not(:disabled){background:#6d28d9}
#status{padding:10px 16px;border-radius:6px;font-size:13px;font-weight:500;margin-bottom:12px}
.status-info{background:#e8f4fd;color:#0369a1;border-left:4px solid #0284c7}
.status-ok{background:#d1fae5;color:#065f46;border-left:4px solid #10b981}
.status-err{background:#fee2e2;color:#991b1b;border-left:4px solid #ef4444}
.summary{background:#fff;border-radius:8px;padding:14px 18px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.1);font-size:13px;display:none;max-height:200px;overflow-y:auto}
.summary h4{margin-bottom:8px;color:#dc2626}
.summary .err-row{padding:4px 0;border-bottom:1px solid #fee2e2;color:#7f1d1d}
.summary .err-row:last-child{border-bottom:none}
.table-wrap{overflow:auto;max-height:72vh;background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
table{border-collapse:collapse;font-size:12px;table-layout:fixed}
thead th{background:#1e293b;color:#fff;padding:8px 10px;position:sticky;top:0;z-index:2;text-align:left;white-space:nowrap;font-weight:600;letter-spacing:.3px;min-width:160px}
thead th.row-num{width:45px;min-width:45px;text-align:center;background:#0f172a;position:sticky;left:0;z-index:3}
tbody td{padding:3px 4px;border-bottom:1px solid #e2e8f0;vertical-align:top;min-width:160px}
tbody td.row-num{background:#f8fafc;text-align:center;color:#64748b;font-weight:600;font-size:11px;min-width:45px;width:45px;position:sticky;left:0;z-index:1}
tbody tr:hover{background:#f8fafc}
tbody tr.has-error{background:#fef2f2}
tbody tr.has-error:hover{background:#fee2e2}
.cell-wrap input{width:100%;border:1px solid #e2e8f0;padding:5px 7px;font-size:12px;border-radius:3px;background:#fff;font-family:inherit;min-width:140px}
.cell-wrap input:focus{outline:none;border-color:#4361ee;box-shadow:0 0 0 2px rgba(67,97,238,.15)}
.cell-wrap input.cell-err{border-color:#ef4444;background:#fef2f2}
.cell-wrap input.cell-err:focus{box-shadow:0 0 0 2px rgba(239,68,68,.2)}
.cell-wrap input.cell-ok{border-color:#10b981;background:#f0fdf4}
.cell-wrap input.cell-autocorrected{border-color:#f59e0b;background:#fffbeb}
.cell-err-msg{color:#dc2626;font-size:10px;margin-top:1px;line-height:1.3}
.legend{display:flex;gap:16px;font-size:12px;color:#64748b;margin-top:10px;padding:8px 0;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px}
.legend .dot{width:12px;height:12px;border-radius:2px;display:inline-block}
.dot-err{background:#fef2f2;border:1px solid #ef4444}
.dot-ok{background:#d1fae5;border:1px solid #10b981}
.dot-neutral{background:#fff;border:1px solid #e2e8f0}
.dot-auto{background:#fffbeb;border:1px solid #f59e0b}
.required-badge{color:#dc2626;font-size:10px;font-weight:700}
.optional-badge{color:#94a3b8;font-size:10px}
.autocorrect-log{background:#fff;border-radius:8px;padding:14px 18px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.1);font-size:12px;display:none;max-height:180px;overflow-y:auto}
.autocorrect-log h4{margin-bottom:8px;color:#92400e}
.autocorrect-log .ac-row{padding:3px 0;border-bottom:1px solid #fef3c7;color:#78350f}
.autocorrect-log .ac-row:last-child{border-bottom:none}
.autocorrect-log .ac-field{font-weight:600}
.tooltip{position:absolute;bottom:calc(100% + 4px);left:0;z-index:100;background:#1e293b;color:#f1f5f9;padding:10px 12px;border-radius:6px;font-size:11px;line-height:1.5;max-width:340px;min-width:220px;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:none;opacity:0;transition:opacity .2s;display:flex;flex-direction:column;gap:4px}
.tooltip .tip-msg{color:#fca5a5;font-weight:600;font-size:12px}
.tooltip .tip-rule{color:#fbbf24;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.3px}
.tooltip .tip-hint{color:#86efac;border-top:1px solid #334155;padding-top:6px;margin-top:2px}
.tooltip .tip-hint::before{content:'Fix: '}
.cell-wrap{position:relative}
.cell-wrap:hover .tooltip{opacity:1}
</style>
</head>
<body>
<h2>BPLS Business - CSV Validator & Formatter (Table 1)</h2>

<div class="toolbar">
  <input type="file" id="csvFile" accept=".csv">
  <button class="btn btn-purple" id="autocorrectBtn" disabled>Auto-Correct</button>
  <button class="btn btn-primary" id="validateBtn" disabled>Validate</button>
  <button class="btn btn-warning" id="revalidateBtn" style="display:none">Re-Validate</button>
  <button class="btn btn-success" id="exportBtn" style="display:none" disabled>Export Corrected CSV</button>
</div>

<div id="status" class="status-info">Upload a CSV file to begin validation.</div>
<div id="autocorrectLog" class="autocorrect-log"></div>
<div id="errorSummary" class="summary"></div>

<div id="tableContainer"></div>

<div class="legend">
  <span><span class="dot dot-err"></span> Error</span>
  <span><span class="dot dot-ok"></span> Valid</span>
  <span><span class="dot dot-neutral"></span> Not validated</span>
  <span><span class="dot dot-auto"></span> Auto-corrected</span>
  <span style="color:#dc2626">*</span> Required
  <span style="color:#94a3b8">opt</span> Optional
  <span style="color:#f59e0b">&#9888;</span> Conditional
</div>

<script>
const RULES = {
  bin: { required: true, label: 'BIN' },
  business_name: { required: true, label: 'Business Name', min: 3, max: 100 },
  trade_name: { required: false, label: 'Trade Name', min: 3, max: 100 },
  business_type: {
    required: true, label: 'Business Type',
    allowed: ['SOLE PROPRIETORSHIP','ONE PERSON CORPORATION','PARTNERSHIP','CORPORATION','COOPERATIVE']
  },
  dti_no: { required: false, conditional: true, label: 'DTI No.', min: 3, max: 30 },
  dti_registratrion_expiry_date: { required: false, conditional: true, label: 'DTI Expiry Date' },
  sec_no: { required: false, conditional: true, label: 'SEC No.', min: 3, max: 30 },
  cda_no: { required: false, conditional: true, label: 'CDA No.', min: 3, max: 30 },
  tin_no: { required: false, label: 'TIN No.' },
  email_address: { required: true, label: 'Email Address', min: 3, max: 100 },
  cellphone_no: { required: true, label: 'Cellphone No.' },
  telephone_no: { required: false, label: 'Telephone No.', min: 3, max: 20 },
  incharge_first_name: { required: true, label: 'First Name', min: 3, max: 100 },
  incharge_middle_name: { required: false, label: 'Middle Name', min: 3, max: 100 },
  incharge_last_name: { required: true, label: 'Last Name', min: 3, max: 100 },
  incharge_extension_name: { required: false, label: 'Ext. Name', min: 3, max: 100 },
  incharge_sex: { required: true, label: 'Sex', allowed: ['M','F'] },
  incharge_country_of_citizenship: { required: true, label: 'Citizenship', min: 3, max: 100 },
  incharge_street: { required: false, label: 'Incharge Street', min: 3, max: 100 },
  incharge_barangay: { required: true, label: 'Incharge Barangay', min: 3, max: 100 },
  incharge_municipality: { required: true, label: 'Incharge Municipality', min: 3, max: 100 },
  incharge_province: { required: true, label: 'Incharge Province', min: 3, max: 100 },
  office_street: { required: false, label: 'Office Street', min: 3, max: 100 },
  office_barangay_code: { required: true, label: 'Office Brgy Code' },
  location_owned: { required: true, label: 'Location Owned' },
  tdn_no: { required: false, conditional: true, label: 'TDN No.', min: 3, max: 20 },
  pin_no: { required: false, conditional: true, label: 'PIN No.', min: 3, max: 20 },
  lessor_name: { required: false, conditional: true, label: 'Lessor Name', min: 3, max: 150 },
  monthly_rental: { required: false, conditional: true, label: 'Monthly Rental' },
  area: { required: true, label: 'Area', numeric: true },
  no_of_male_employees: { required: true, label: 'Male Employees', numeric: true },
  no_of_female_employees: { required: true, label: 'Female Employees', numeric: true },
  no_of_employees_residing_within_the_area: { required: true, label: 'Residing Employees', numeric: true },
  no_of_van: { required: true, label: 'Vans', numeric: true },
  no_of_truck: { required: true, label: 'Trucks', numeric: true },
  no_of_motorcycle: { required: true, label: 'Motorcycles', numeric: true },
  activity_type: { required: true, label: 'Activity Type', min: 3, max: 100 }
};

const HINTS = {
  bin: { rule: 'BIN Format: PSGC7-YEAR4-INC7', fix: 'Use format: 7-digit PSGC code + dash + 4-digit year + dash + 7-digit increment. Example: 1400101-2024-0000001' },
  business_name: { rule: 'Required, 3-100 characters', fix: 'Enter the full registered business name. Must be at least 3 characters, max 100.' },
  trade_name: { rule: 'Optional, 3-100 characters if provided', fix: 'Leave blank or enter a trade/brand name between 3-100 characters.' },
  business_type: { rule: 'Must be one of 5 allowed types', fix: 'Use exactly: SOLE PROPRIETORSHIP, ONE PERSON CORPORATION, PARTNERSHIP, CORPORATION, or COOPERATIVE' },
  dti_no: { rule: 'Required if SOLE PROPRIETORSHIP', fix: 'Enter DTI registration number (3-30 chars). Required when Business Type is SOLE PROPRIETORSHIP.' },
  dti_registratrion_expiry_date: { rule: 'Required if SOLE PROPRIETORSHIP, format MM/DD/YYYY', fix: 'Enter date as MM/DD/YYYY. Example: 12/31/2025. Required when Business Type is SOLE PROPRIETORSHIP.' },
  sec_no: { rule: 'Required for OPC/PARTNERSHIP/CORPORATION', fix: 'Enter SEC registration number (3-30 chars). Required when Business Type is ONE PERSON CORPORATION, PARTNERSHIP, or CORPORATION.' },
  cda_no: { rule: 'Required if COOPERATIVE', fix: 'Enter CDA registration number (3-30 chars). Required when Business Type is COOPERATIVE.' },
  tin_no: { rule: 'Optional, numbers and dashes only', fix: 'Enter TIN using digits and dashes only. Example: 123-456-789' },
  email_address: { rule: 'Required, valid email format', fix: 'Enter a valid email address. Example: business@email.com. Spaces are not allowed.' },
  cellphone_no: { rule: 'Required, 12 digits starting with 639', fix: 'Enter as 639xxxxxxxxx (12 digits). The system auto-converts 09xx and 9xx formats.' },
  telephone_no: { rule: 'Optional, 3-20 characters', fix: 'Leave blank or enter landline number between 3-20 characters.' },
  incharge_first_name: { rule: 'Required, min 3 characters', fix: 'Enter the first name of the person in charge (at least 3 characters).' },
  incharge_middle_name: { rule: 'Optional, min 3 characters if provided', fix: 'Leave blank or enter middle name (at least 3 characters).' },
  incharge_last_name: { rule: 'Required, min 3 characters', fix: 'Enter the last name/surname of the person in charge (at least 3 characters).' },
  incharge_extension_name: { rule: 'Optional, min 3 characters if provided', fix: 'Leave blank or enter extension like JR, SR, III. Periods are auto-removed.' },
  incharge_sex: { rule: 'Required, must be M or F', fix: 'Enter M for Male or F for Female. The system auto-converts MALE/FEMALE.' },
  incharge_country_of_citizenship: { rule: 'Required, min 3 characters', fix: 'Enter country of citizenship. Example: Filipino, American, Chinese' },
  incharge_street: { rule: 'Optional, min 3 characters if provided', fix: 'Leave blank or enter street address (at least 3 characters).' },
  incharge_barangay: { rule: 'Required, min 3 characters', fix: 'Enter the barangay of the person in charge (at least 3 characters).' },
  incharge_municipality: { rule: 'Required, min 3 characters', fix: 'Enter the municipality/city of the person in charge (at least 3 characters).' },
  incharge_province: { rule: 'Required, min 3 characters', fix: 'Enter the province of the person in charge (at least 3 characters).' },
  office_street: { rule: 'Optional, min 3 characters if provided', fix: 'Leave blank or enter office street address (at least 3 characters).' },
  office_barangay_code: { rule: 'Required', fix: 'Enter the PSGC barangay code for the business office location.' },
  location_owned: { rule: 'Required, must be 1 (owned) or 0 (rented)', fix: 'Enter 1 if the business location is owned, or 0 if rented. Auto-converts: yes/true/owned → 1, no/false/rented → 0.' },
  tdn_no: { rule: 'Required for owned (location_owned=1), 3-20 chars', fix: 'Enter Tax Declaration Number. Required when location is owned, unless PIN is provided.' },
  pin_no: { rule: 'Required for owned (location_owned=1), 3-20 chars', fix: 'Enter Property Identification Number. Required when location is owned, unless TDN is provided.' },
  lessor_name: { rule: 'Required for rented (location_owned=0), 3-150 chars', fix: 'Enter the name of the lessor/property owner. Required when location is rented.' },
  monthly_rental: { rule: 'Required for rented (location_owned=0), non-negative number', fix: 'Enter the monthly rental amount as a whole number. Required when location is rented.' },
  area: { rule: 'Required, non-negative number', fix: 'Enter the business area in square meters as a whole number.' },
  no_of_male_employees: { rule: 'Required, non-negative number', fix: 'Enter the count of male employees (whole number, 0 or more).' },
  no_of_female_employees: { rule: 'Required, non-negative number', fix: 'Enter the count of female employees (whole number, 0 or more).' },
  no_of_employees_residing_within_the_area: { rule: 'Required, cannot exceed total employees', fix: 'Enter count of employees residing in the business area. Must not exceed Male + Female employees combined.' },
  no_of_van: { rule: 'Required, non-negative number', fix: 'Enter the number of vans owned/used by the business (whole number, 0 or more).' },
  no_of_truck: { rule: 'Required, non-negative number', fix: 'Enter the number of trucks owned/used by the business (whole number, 0 or more).' },
  no_of_motorcycle: { rule: 'Required, non-negative number', fix: 'Enter the number of motorcycles owned/used by the business (whole number, 0 or more).' },
  activity_type: { rule: 'Required, min 3 characters', fix: 'Enter the type of business activity. Example: Retail, Wholesale, Manufacturing, Food Service' }
};

const FIELD_ORDER = [
  'bin','business_name','trade_name','business_type',
  'dti_no','dti_registratrion_expiry_date','sec_no','cda_no','tin_no',
  'email_address','cellphone_no','telephone_no',
  'incharge_first_name','incharge_middle_name','incharge_last_name','incharge_extension_name',
  'incharge_sex','incharge_country_of_citizenship','incharge_street',
  'incharge_barangay','incharge_municipality','incharge_province',
  'office_street','office_barangay_code','location_owned',
  'tdn_no','pin_no','lessor_name','monthly_rental',
  'area','no_of_male_employees','no_of_female_employees',
  'no_of_employees_residing_within_the_area',
  'no_of_van','no_of_truck','no_of_motorcycle','activity_type'
];

const DATE_FIELDS = ['dti_registratrion_expiry_date'];

let headers = [];
let rows = [];
let cellErrors = {};
let autocorrectedCells = {};

const v = (row, key) => (row[key] == null ? '' : String(row[key])).trim();

function pad2(n){ return String(n).padStart(2,'0'); }

function formatDateStr(raw) {
  if (!raw || !raw.trim()) return '';
  let s = raw.trim();
  s = s.replace(/^'+/, '');
  if (/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;
  let d = new Date(s);
  if (isNaN(d.getTime())) return raw;
  return pad2(d.getMonth()+1) + '/' + pad2(d.getDate()) + '/' + d.getFullYear();
}

function autoCorrectRow(row, rowIdx) {
  let fixes = [];
  let orig, fixed;

  orig = v(row, 'business_type');
  if (orig) {
    fixed = orig.toUpperCase();
    if (fixed !== orig) { fixes.push('business_type: "' + orig + '" -> "' + fixed + '"'); row.business_type = fixed; }
    let match = RULES.business_type.allowed.find(a => a === fixed);
    if (!match) {
      let lower = orig.toLowerCase().replace(/[^a-z ]/g,'').trim();
      let suggestions = RULES.business_type.allowed.filter(a => a.toLowerCase().includes(lower) || lower.includes(a.toLowerCase().replace(/[^a-z ]/g,'')));
      if (suggestions.length === 1) {
        fixes.push('business_type: auto-matched "' + orig + '" -> "' + suggestions[0] + '"');
        row.business_type = suggestions[0];
      }
    }
  }

  orig = v(row, 'incharge_sex');
  if (orig) {
    let up = orig.toUpperCase();
    if (up === 'MALE' || up === 'M') fixed = 'M';
    else if (up === 'FEMALE' || up === 'F') fixed = 'F';
    else fixed = up;
    if (fixed !== orig) { fixes.push('incharge_sex: "' + orig + '" -> "' + fixed + '"'); row.incharge_sex = fixed; }
  }

  orig = v(row, 'cellphone_no');
  if (orig) {
    let digits = orig.replace(/[^\d]/g, '');
    if (digits.length > 0) {
      let fixed_phone = digits;
      if (digits.startsWith('09') && digits.length === 11) { fixed_phone = '639' + digits.substring(2); fixes.push('cellphone_no: converted 09xx to 639xx'); }
      else if (digits.startsWith('9') && digits.length === 10) { fixed_phone = '639' + digits.substring(1); fixes.push('cellphone_no: added 63 prefix'); }
      else if (digits.startsWith('+639') || digits.startsWith('639')) { fixed_phone = digits.replace(/^[\+]?63/, '639'); }
      else if (digits.startsWith('0') && digits.length === 11) { fixed_phone = '63' + digits.substring(1); fixes.push('cellphone_no: converted 0xx to 63xx'); }
      if (fixed_phone !== orig) row.cellphone_no = fixed_phone;
    }
  }

  orig = v(row, 'location_owned');
  if (orig) {
    let lo = orig.toLowerCase().trim();
    if (lo === 'true' || lo === 'yes' || lo === 'owned' || lo === '1') fixed = '1';
    else if (lo === 'false' || lo === 'no' || lo === 'rented' || lo === '0') fixed = '0';
    else fixed = orig;
    if (fixed !== orig) { fixes.push('location_owned: "' + orig + '" -> "' + fixed + '"'); row.location_owned = fixed; }
  }

  orig = v(row, 'incharge_extension_name');
  if (orig && orig.includes('.')) {
    fixed = orig.replace(/\./g, '');
    fixes.push('incharge_extension_name: removed periods');
    row.incharge_extension_name = fixed;
  }

  ['area','no_of_male_employees','no_of_female_employees','no_of_employees_residing_within_the_area','no_of_van','no_of_truck','no_of_motorcycle','monthly_rental'].forEach(f => {
    orig = v(row, f);
    if (orig) {
      let n = orig.replace(/[^\d.-]/g, '');
      if (n !== '' && !isNaN(n) && n !== orig) {
        fixed = Math.floor(Number(n)).toString();
        fixes.push(f + ': "' + orig + '" -> "' + fixed + '"');
        row[f] = fixed;
      }
    }
  });

  DATE_FIELDS.forEach(f => {
    orig = v(row, f);
    if (orig) {
      fixed = formatDateStr(orig);
      if (fixed !== orig) {
        fixes.push(f + ': "' + orig + '" -> "' + fixed + '"');
        row[f] = fixed;
      }
    }
  });

  orig = v(row, 'email_address');
  if (orig) {
    fixed = orig.trim().toLowerCase();
    if (fixed !== orig) { fixes.push('email_address: trimmed/lowercased'); row.email_address = fixed; }
  }

  return fixes;
}

function formatRow(row) {
  if (v(row,'business_type')) row.business_type = v(row,'business_type').toUpperCase();
  let sex = v(row,'incharge_sex').toUpperCase();
  if (sex === 'MALE') row.incharge_sex = 'M';
  else if (sex === 'FEMALE') row.incharge_sex = 'F';
  else if (sex) row.incharge_sex = sex.charAt(0);
  let loc = v(row,'location_owned').toLowerCase().trim();
  if (['1','true','yes','owned'].includes(loc)) row.location_owned = '1';
  else if (['0','false','no','rented'].includes(loc)) row.location_owned = '0';
  let phone = v(row,'cellphone_no').replace(/[^\d]/g,'');
  if (phone.startsWith('09') && phone.length === 11) phone = '639' + phone.substring(2);
  else if (phone.startsWith('9') && phone.length === 10) phone = '639' + phone.substring(1);
  else if (phone.startsWith('0') && phone.length === 11) phone = '63' + phone.substring(1);
  row.cellphone_no = phone;
  row.incharge_extension_name = v(row,'incharge_extension_name').replace(/\./g, '');
  ['area','no_of_male_employees','no_of_female_employees','no_of_employees_residing_within_the_area','no_of_van','no_of_truck','no_of_motorcycle','monthly_rental'].forEach(f => {
    let n = v(row,f).replace(/[^\d.-]/g,'');
    if (n !== '' && !isNaN(n)) row[f] = Math.floor(Number(n)).toString();
  });
  DATE_FIELDS.forEach(f => {
    let dt = v(row, f);
    if (dt) row[f] = formatDateStr(dt);
  });
  if (v(row,'email_address')) row.email_address = v(row,'email_address').trim().toLowerCase();
  return row;
}

function validateRow(row, rowIdx, seenBins) {
  let errs = {};
  const g = (key) => v(row, key);

  let bin = g('bin');
  if (!bin) errs.bin = 'Required';
  else if (!/^\d{7}-\d{4}-\d{7}$/.test(bin)) errs.bin = 'Format: PSGC7-YEAR4-INC7 (e.g. 1400101-2024-0000001)';
  else if (seenBins.has(bin)) errs.bin = 'Duplicate BIN';
  else seenBins.add(bin);

  if (g('business_name').length < 3) errs.business_name = 'Min 3 characters';
  else if (g('business_name').length > 100) errs.business_name = 'Max 100 characters';

  let tn = g('trade_name');
  if (tn && (tn.length < 3 || tn.length > 100)) errs.trade_name = 'If provided, 3-100 characters';

  const bt = g('business_type');
  const validTypes = RULES.business_type.allowed;
  if (!bt) errs.business_type = 'Required';
  else if (!validTypes.includes(bt)) errs.business_type = 'Must be: ' + validTypes.join(', ');

  if (bt === 'SOLE PROPRIETORSHIP') {
    let dti = g('dti_no');
    if (!dti) errs.dti_no = 'Required for SOLE PROPRIETORSHIP';
    else if (dti.length < 3 || dti.length > 30) errs.dti_no = '3-30 characters';
    let dtiDate = g('dti_registratrion_expiry_date');
    if (!dtiDate) errs['dti_registratrion_expiry_date'] = 'Required for SOLE PROPRIETORSHIP';
    else if (!/^\d{2}\/\d{2}\/\d{4}$/.test(dtiDate)) errs['dti_registratrion_expiry_date'] = 'Must be MM/DD/YYYY';
  }

  if (['ONE PERSON CORPORATION','PARTNERSHIP','CORPORATION'].includes(bt)) {
    let sec = g('sec_no');
    if (!sec) errs.sec_no = 'Required for ' + bt;
    else if (sec.length < 3 || sec.length > 30) errs.sec_no = '3-30 characters';
  }

  if (bt === 'COOPERATIVE') {
    if (!g('cda_no')) errs.cda_no = 'Required for COOPERATIVE';
    else if (g('cda_no').length < 3 || g('cda_no').length > 30) errs.cda_no = '3-30 characters';
  }

  let tin = g('tin_no');
  if (tin && !/^[\d-]+$/.test(tin)) errs.tin_no = 'Numbers and dashes only';

  let email = g('email_address');
  if (!email) errs.email_address = 'Required';
  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) errs.email_address = 'Invalid email format';

  let phone = g('cellphone_no');
  if (!phone) errs.cellphone_no = 'Required';
  else if (!/^\d+$/.test(phone)) errs.cellphone_no = 'Digits only';
  else if (!phone.startsWith('639')) errs.cellphone_no = 'Must start with 639';
  else if (phone.length !== 12) errs.cellphone_no = 'Must be 12 digits (639xxxxxxxxx)';

  let tel = g('telephone_no');
  if (tel && (tel.length < 3 || tel.length > 20)) errs.telephone_no = '3-20 characters';

  if (g('incharge_first_name').length < 3) errs.incharge_first_name = 'Min 3 characters';
  if (g('incharge_last_name').length < 3) errs.incharge_last_name = 'Min 3 characters';
  let mid = g('incharge_middle_name');
  if (mid && mid.length < 3) errs.incharge_middle_name = 'If provided, min 3 chars';
  let ext = g('incharge_extension_name');
  if (ext && ext.length < 3) errs.incharge_extension_name = 'If provided, min 3 chars';
  if (!['M','F'].includes(g('incharge_sex'))) errs.incharge_sex = 'Must be M or F';
  if (!g('incharge_country_of_citizenship')) errs.incharge_country_of_citizenship = 'Required';
  else if (g('incharge_country_of_citizenship').length < 3) errs.incharge_country_of_citizenship = 'Min 3 characters';
  let iStreet = g('incharge_street');
  if (iStreet && iStreet.length < 3) errs.incharge_street = 'If provided, min 3 chars';
  if (!g('incharge_barangay')) errs.incharge_barangay = 'Required';
  else if (g('incharge_barangay').length < 3) errs.incharge_barangay = 'Min 3 chars';
  if (!g('incharge_municipality')) errs.incharge_municipality = 'Required';
  else if (g('incharge_municipality').length < 3) errs.incharge_municipality = 'Min 3 chars';
  if (!g('incharge_province')) errs.incharge_province = 'Required';
  else if (g('incharge_province').length < 3) errs.incharge_province = 'Min 3 chars';

  let oStreet = g('office_street');
  if (oStreet && oStreet.length < 3) errs.office_street = 'If provided, min 3 chars';
  if (!g('office_barangay_code')) errs.office_barangay_code = 'Required';

  let locOwned = g('location_owned');
  if (!locOwned) errs.location_owned = 'Required (1=owned, 0=rented)';
  else if (!['0','1'].includes(locOwned)) errs.location_owned = 'Must be 1 or 0';

  if (locOwned === '1') {
    let tdn = g('tdn_no'), pin = g('pin_no');
    if (!tdn && !pin) {
      errs.tdn_no = 'Provide TDN or PIN for owned';
      errs.pin_no = 'Provide TDN or PIN for owned';
    }
    if (tdn && (tdn.length < 3 || tdn.length > 20)) errs.tdn_no = '3-20 chars';
    if (pin) {
      if (!/^[\d-]+$/.test(pin)) errs.pin_no = 'Numbers/dashes only';
      else if (pin.length < 3 || pin.length > 20) errs.pin_no = '3-20 chars';
    }
  }

  if (locOwned === '0') {
    if (!g('lessor_name')) errs.lessor_name = 'Required for rented';
    else if (g('lessor_name').length < 3 || g('lessor_name').length > 150) errs.lessor_name = '3-150 chars';
    let rent = g('monthly_rental');
    if (!rent) errs.monthly_rental = 'Required for rented';
    else if (!/^\d+$/.test(rent) || Number(rent) < 0) errs.monthly_rental = 'Non-negative number required';
  }

  ['area','no_of_male_employees','no_of_female_employees','no_of_employees_residing_within_the_area','no_of_van','no_of_truck','no_of_motorcycle'].forEach(f => {
    let n = g(f);
    if (n === '') errs[f] = 'Required';
    else if (!/^\d+$/.test(n) || Number(n) < 0) errs[f] = 'Non-negative number required';
  });

  let male = Number(g('no_of_male_employees') || 0);
  let female = Number(g('no_of_female_employees') || 0);
  let residing = Number(g('no_of_employees_residing_within_the_area') || 0);
  if (residing > male + female && !errs.no_of_employees_residing_within_the_area) {
    errs.no_of_employees_residing_within_the_area = 'Cannot exceed total (' + (male+female) + ')';
  }

  if (!g('activity_type')) errs.activity_type = 'Required';
  else if (g('activity_type').length < 3) errs.activity_type = 'Min 3 chars';

  return errs;
}

function runAutoCorrect() {
  autocorrectedCells = {};
  let totalFixes = 0;
  let allLogs = [];
  rows.forEach((row, idx) => {
    let fixes = autoCorrectRow(row, idx);
    if (fixes.length > 0) {
      autocorrectedCells[idx] = new Set();
      fixes.forEach(fix => {
        let match = fix.match(/^([a-z_]+)/i);
        if (match) autocorrectedCells[idx].add(match[1].toLowerCase());
        totalFixes++;
      });
      allLogs.push({ row: idx+1, fixes });
    }
  });

  let logEl = document.getElementById('autocorrectLog');
  if (totalFixes > 0) {
    logEl.style.display = 'block';
    let html = '<h4>Auto-Correct Applied (' + totalFixes + ' fix' + (totalFixes>1?'es':'') + ')</h4>';
    allLogs.forEach(({row, fixes}) => {
      html += '<div class="ac-row"><b>Row ' + row + ':</b> ' + fixes.join(' &bull; ') + '</div>';
    });
    logEl.innerHTML = html;
  } else {
    logEl.style.display = 'block';
    logEl.innerHTML = '<h4>Auto-Correct</h4><div class="ac-row">No auto-correctable issues found.</div>';
  }

  let s = document.getElementById('status');
  s.className = 'status-warn';
  s.textContent = 'Auto-correct applied ' + totalFixes + ' fix' + (totalFixes!==1?'es':'') + '. Click "Validate" to check remaining errors. Edits auto-revalidate.';
  renderTable();
}

function validateAll() {
  hasValidated = true;
  cellErrors = {};
  let totalErrors = 0;
  let seenBins = new Set();
  rows.forEach((row, idx) => {
    let errs = validateRow(row, idx, seenBins);
    if (Object.keys(errs).length > 0) {
      cellErrors[idx] = errs;
      totalErrors += Object.keys(errs).length;
    }
  });
  renderTable();
  updateStatus(totalErrors);
}

function updateStatus(errCount) {
  const s = document.getElementById('status');
  const sum = document.getElementById('errorSummary');
  const exportBtn = document.getElementById('exportBtn');
  exportBtn.style.display = 'inline-block';
  exportBtn.disabled = false;
  document.getElementById('revalidateBtn').style.display = 'inline-block';

  if (errCount === 0) {
    s.className = 'status-ok';
    s.textContent = 'All ' + rows.length + ' rows are valid. Click "Export Corrected CSV" to save.';
    sum.style.display = 'none';
  } else {
    s.className = 'status-err';
    s.textContent = 'Found ' + errCount + ' error(s) in ' + Object.keys(cellErrors).length + ' of ' + rows.length + ' row(s). Edit cells to auto-fix, or export as-is.';
    sum.style.display = 'block';
    let html = '<h4>Error Summary (' + errCount + ' errors)</h4>';
    Object.entries(cellErrors).forEach(([r, errs]) => {
      let items = Object.entries(errs).map(([k,msg]) => '<b>' + (RULES[k]?.label || k) + ':</b> ' + msg).join(' &bull; ');
      html += '<div class="err-row">Row ' + (Number(r)+1) + ': ' + items + '</div>';
    });
    sum.innerHTML = html;
  }
}

function renderTable() {
  const c = document.getElementById('tableContainer');
  if (!rows.length) return;

  let displayHeaders = headers.length ? headers : FIELD_ORDER;
  let orderedHeaders = [];
  FIELD_ORDER.forEach(f => { if (displayHeaders.includes(f)) orderedHeaders.push(f); });
  displayHeaders.forEach(f => { if (!orderedHeaders.includes(f)) orderedHeaders.push(f); });

  let validated = hasValidated;

  let html = '<div class="table-wrap"><table><thead><tr><th class="row-num">#</th>';
  orderedHeaders.forEach(h => {
    let rule = RULES[h];
    let badge = '';
    if (rule) {
      if (rule.required) badge = ' <span class="required-badge">*</span>';
      else if (rule.conditional) badge = ' <span style="color:#f59e0b;font-size:10px">&#9888;</span>';
      else badge = ' <span class="optional-badge">opt</span>';
    }
    html += '<th>' + (rule?.label || h) + badge + '</th>';
  });
  html += '</tr></thead><tbody>';

  rows.forEach((row, rIdx) => {
    let hasErr = cellErrors[rIdx] && Object.keys(cellErrors[rIdx]).length > 0;
    html += '<tr class="' + (hasErr ? 'has-error' : '') + '"><td class="row-num">' + (rIdx+1) + '</td>';
    orderedHeaders.forEach(key => {
      let err = cellErrors[rIdx]?.[key];
      let isAuto = autocorrectedCells[rIdx] && autocorrectedCells[rIdx].has(key);
      let cls = '';
      if (err) cls = 'cell-err';
      else if (isAuto && validated) cls = 'cell-autocorrected';
      else if (validated) cls = 'cell-ok';
      let displayVal = row[key] || '';
      let tooltipHtml = buildTooltip(key, err);
      html += '<td><div class="cell-wrap"><input type="text" class="' + cls + '" data-row="' + rIdx + '" data-col="' + key + '" value="' + escapeAttr(displayVal) + '">' + tooltipHtml + '</div></td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  c.innerHTML = html;

  c.querySelectorAll('input').forEach(input => {
    input.addEventListener('change', onCellChange);
    input.addEventListener('input', onCellInput);
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Tab') return;
      if (e.key === 'Enter') { e.preventDefault(); this.blur(); }
    });
  });
}

function escapeAttr(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

let hasValidated = false;

function buildTooltip(key, err) {
  if (!err) return '';
  let hint = HINTS[key];
  let parts = [];
  parts.push('<div class="tip-msg">&#x26A0; ' + escapeHtml(err) + '</div>');
  if (hint) {
    parts.push('<div class="tip-rule">' + escapeHtml(hint.rule) + '</div>');
    parts.push('<div class="tip-hint">' + escapeHtml(hint.fix) + '</div>');
  }
  return '<div class="tooltip">' + parts.join('') + '</div>';
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function onCellInput(e) {
  if (!hasValidated) return;
  const r = parseInt(e.target.dataset.row);
  const k = e.target.dataset.col;
  let val = e.target.value;
  if (k === 'business_type') val = val.toUpperCase();
  if (k === 'incharge_sex') {
    let up = val.toUpperCase();
    if (up === 'MALE') val = 'M'; else if (up === 'FEMALE') val = 'F'; else val = up.charAt(0);
  }
  if (k === 'cellphone_no') val = val.replace(/[^\d]/g, '');
  if (k === 'incharge_extension_name') val = val.replace(/\./g, '');
  if (DATE_FIELDS.includes(k)) val = formatDateStr(val);
  rows[r][k] = val;
  if (val !== e.target.value) e.target.value = val;
  runLiveValidation(r, k, e.target);
}

function onCellChange(e) {
  const r = parseInt(e.target.dataset.row);
  const k = e.target.dataset.col;
  let val = e.target.value;
  if (k === 'business_type') val = val.toUpperCase();
  if (k === 'incharge_sex') {
    let up = val.toUpperCase();
    if (up === 'MALE') val = 'M'; else if (up === 'FEMALE') val = 'F'; else val = up.charAt(0);
  }
  if (k === 'cellphone_no') val = val.replace(/[^\d]/g, '');
  if (k === 'incharge_extension_name') val = val.replace(/\./g, '');
  if (DATE_FIELDS.includes(k)) val = formatDateStr(val);
  rows[r][k] = val;
  e.target.value = val;
  if (!hasValidated) return;
  runLiveValidation(r, k, e.target);
}

function runLiveValidation(changedRow, changedKey, changedInput) {
  let totalErrors = 0;
  let seenBins = new Set();
  rows.forEach((row, idx) => {
    let errs = validateRow(row, idx, seenBins);
    if (Object.keys(errs).length > 0) {
      cellErrors[idx] = errs;
      totalErrors += Object.keys(errs).length;
    } else {
      delete cellErrors[idx];
    }
  });
  updateStatus(totalErrors);
  updateRowVisuals(changedRow, changedInput);
}

function updateRowVisuals(rowIdx, changedInput) {
  let container = document.getElementById('tableContainer');
  let rowInputs = container.querySelectorAll('input[data-row="' + rowIdx + '"]');
  let rowTr = (rowInputs.length > 0 ? rowInputs[0].closest('tr') : null);

  if (rowTr) {
    let hasErr = cellErrors[rowIdx] && Object.keys(cellErrors[rowIdx]).length > 0;
    rowTr.className = hasErr ? 'has-error' : '';
  }

  rowInputs.forEach(input => {
    let key = input.dataset.col;
    let err = cellErrors[rowIdx]?.[key];
    let isAuto = autocorrectedCells[rowIdx] && autocorrectedCells[rowIdx].has(key);

    input.className = '';
    if (err) input.classList.add('cell-err');
    else if (isAuto) input.classList.add('cell-autocorrected');
    else input.classList.add('cell-ok');

    let wrap = input.closest('.cell-wrap');
    let oldTip = wrap.querySelector('.tooltip');
    if (oldTip) oldTip.remove();
    let newTip = buildTooltip(key, err);
    if (newTip) wrap.insertAdjacentHTML('beforeend', newTip);
  });
}

function exportCSV() {
  let exportRows = rows.map(row => {
    let out = {};
    headers.forEach(h => {
      let val = row[h] != null ? String(row[h]).trim() : '';
      if (DATE_FIELDS.includes(h) && val && /^\d{2}\/\d{2}\/\d{4}$/.test(val)) {
        let parts = val.split('/');
        if (parts[0].startsWith('0') || parts[1].startsWith('0')) {
          val = "'" + val;
        }
      }
      out[h] = val;
    });
    return out;
  });

  let csv = Papa.unparse(exportRows, { columns: headers });
  let BOM = '\uFEFF';
  let blob = new Blob([BOM + csv], { type: 'text/csv;charset=utf-8;' });
  let link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'validated_table1_business.csv';
  link.click();
  URL.revokeObjectURL(link.href);
}

document.getElementById('csvFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  Papa.parse(file, {
    header: true,
    skipEmptyLines: true,
    complete: (results) => {
      headers = results.meta.fields || [];
      rows = results.data.map(r => formatRow({...r}));
      cellErrors = {};
      autocorrectedCells = {};
      hasValidated = false;
      document.getElementById('validateBtn').disabled = false;
      document.getElementById('autocorrectBtn').disabled = false;
      let s = document.getElementById('status');
      s.className = 'status-info';
      s.textContent = 'Loaded ' + rows.length + ' rows x ' + headers.length + ' columns. Click "Auto-Correct" then "Validate".';
      document.getElementById('errorSummary').style.display = 'none';
      document.getElementById('autocorrectLog').style.display = 'none';
      document.getElementById('exportBtn').style.display = 'none';
      document.getElementById('revalidateBtn').style.display = 'none';
      renderTable();
    }
  });
});

document.getElementById('autocorrectBtn').addEventListener('click', runAutoCorrect);
document.getElementById('validateBtn').addEventListener('click', validateAll);
document.getElementById('revalidateBtn').addEventListener('click', validateAll);
document.getElementById('exportBtn').addEventListener('click', exportCSV);
</script>
</body>
</html>
